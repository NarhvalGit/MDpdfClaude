<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narhval MD Converter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>NARHVAL</h1>
                <p class="tagline">Markdown Converter</p>
            </div>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h2>Upload je Markdown bestand</h2>
                    <p>Sleep het bestand hiernaartoe of klik om te selecteren</p>
                    <input type="file" id="fileInput" accept=".md,.markdown" hidden>
                    <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                        Selecteer bestand
                    </button>
                </div>

                <div class="file-info" id="fileInfo" style="display: none;">
                    <div class="file-details">
                        <svg class="file-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                            <polyline points="13 2 13 9 20 9"></polyline>
                        </svg>
                        <div>
                            <p class="file-name" id="fileName"></p>
                            <p class="file-size" id="fileSize"></p>
                        </div>
                    </div>
                    <button class="btn-secondary" onclick="resetUpload()">Verwijderen</button>
                </div>
            </div>

            <div class="conversion-section" id="conversionSection" style="display: none;">
                <h3>Kies conversie formaat</h3>
                <div class="format-options">
                    <div class="format-card" onclick="selectFormat('html')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <h4>HTML</h4>
                        <p>Converteer naar HTML formaat</p>
                    </div>
                    <div class="format-card" onclick="selectFormat('pdf')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <h4>PDF</h4>
                        <p>Converteer naar PDF formaat</p>
                    </div>
                </div>

                <div class="preview-section" id="previewSection" style="display: none;">
                    <h3>Preview</h3>
                    <div class="preview-content" id="previewContent"></div>
                    <button class="btn-primary btn-download" id="downloadBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download <span id="formatType"></span>
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Narhval. Alle rechten voorbehouden.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
